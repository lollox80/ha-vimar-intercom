name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Every job here only reads the repository. Declared in the file so that the
# workflow does not depend on the repository or organization default.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned so that a new ruff release cannot turn the CI red on its own;
      # bump it on purpose together with the fixes it asks for.
      - run: pip install ruff==0.16.9
      - run: ruff check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python of the minimum Home Assistant (2025.10: 3.13) and the next one.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # I test girano senza Home Assistant installato: conftest.py fornisce gli
      # stub. I test marcati `live` (che richiedono il citofono in rete) sono
      # esclusi dal marker in pyproject.toml. Quelli `slow` (e2e SIP, ~2 min)
      # sono esclusi di default in locale ma qui girano: -m sovrascrive addopts.
      # Coverage (lines + branches) of custom_components/vimar_intercom: the
      # threshold is fail_under in pyproject.toml, below it the job fails.
      - run: python -m pytest tests -m "not live and not media and not browser" --cov --cov-report=term-missing

  media-browser:
    # A richiesta (workflow_dispatch): media vero (ffmpeg, aiohttp) e la card in
    # Chromium (Playwright). Non a ogni push: minuti e dipendenze pesanti.
    name: pytest -m media / -m browser
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt aiohttp playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -m media
      - run: python -m pytest tests -m browser
