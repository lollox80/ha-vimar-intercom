send_command:
  name: Invia comando SIP
  description: >-
    Invia un SIP MESSAGE arbitrario al citofono Vimar (es. OPEN_2F con header
    "Panda: command"). Utile per sperimentare comandi non ancora mappati.
  fields:
    body:
      name: Comando (body)
      description: Testo del comando, es. OPEN_2F
      required: true
      example: OPEN_2F
      selector:
        text:
    target:
      name: Destinatario
      description: ID SIP (55001 targa esterna, 55002 targa interna, 60001 monitor) o URI sip completo
      default: "55001"
      example: "55001"
      selector:
        text:
    header_name:
      name: Header extra (nome)
      description: Nome dell'header SIP aggiuntivo (vuoto per nessuno)
      default: Panda
      selector:
        text:
    header_value:
      name: Header extra (valore)
      default: command
      selector:
        text:

call:
  name: Chiama
  description: Avvia una chiamata SIP verso una targa/monitor.
  fields:
    target:
      name: Destinatario
      description: ID SIP (default targa esterna 55001)
      example: "55001"
      selector:
        text:

answer:
  name: Rispondi
  description: Risponde alla chiamata in arrivo.

hangup:
  name: Riaggancia
  description: Termina la chiamata attiva.

open_door:
  name: Apri porta
  description: Invia il comando di apertura (OPEN_2F) alla targa indicata.
  fields:
    target:
      name: Targa
      default: "55001"
      selector:
        select:
          options:
            - label: Cancello (targa esterna 55001)
              value: "55001"
            - label: Portone (targa interna 55002)
              value: "55002"
          custom_value: true
    command:
      name: Comando
      default: OPEN_2F
      selector:
        text:

fetch_local:
  name: Fetch HTTP locale
  description: GET (Digest sipID/password) verso l'interfaccia locale del citofono (home mode).
  fields:
    path:
      name: Path
      required: true
      example: rest/get_info.php?action=status
      selector:
        text:
    save_as:
      name: Salva come (nome file, in /config/vimar_intercom/)
      description: >-
        Solo il nome del file: lettere, cifre, punto, trattino e underscore.
        Il file nasce in /config/vimar_intercom/, non dove indichi tu.
      example: vimar_rubrica.db
      selector:
        text:
    host:
      name: Host (default proxy locale)
      description: >-
        Indirizzo IP privato o di loopback, scritto per esteso. Un nome DNS non
        e' accettato: questa richiesta porta la password SIP in Digest e deve
        restare in LAN.
      selector:
        text:
    scheme:
      name: Schema
      default: http
      selector:
        text:

find_sga:
  name: Cerca SGA/PICG
  description: >-
    Chiede GET_NICKS (Panda: blue) agli indirizzi indicati, uno alla volta, e si
    ferma quando il citofono risponde con GET_NICKS_REPLY: la voce con ruolo PICG
    e' il capogruppo dell'impianto. Serve quando non conosci l'SGA e non hai la
    rubrica (impianti solo-cloud, issue #14). Sull'impianto di riferimento
    GET_NICKS non fa comparire notifiche sull'app; su altri impianti non e'
    ancora verificato. Non modifica la configurazione, salvo "Applica".
  fields:
    start:
      name: Primo indirizzo
      description: Inizio dell'intervallo (compreso).
      default: "55000"
      example: "55000"
      selector:
        text:
    end:
      name: Ultimo indirizzo
      description: Fine dell'intervallo (compreso). Al massimo 50 indirizzi.
      default: "55010"
      example: "55010"
      selector:
        text:
    targets:
      name: Indirizzi precisi
      description: >-
        In alternativa all'intervallo, una lista separata da virgole
        (es. 55001, 55002, 55100). Se indicata, start/end vengono ignorati.
      example: "55001, 55002"
      selector:
        text:
    delay:
      name: Pausa tra le sonde (s)
      default: 1.0
      selector:
        number:
          min: 0.2
          max: 10
          step: 0.1
          unit_of_measurement: s
    reply_wait:
      name: Attesa della risposta (s)
      default: 3.0
      selector:
        number:
          min: 1
          max: 15
          step: 0.5
          unit_of_measurement: s
    probe:
      name: Sonda
      description: >-
        get_nicks (default) e' silenziosa sull'app e la risposta dichiara il PICG.
        get_init_status e' l'alternativa per gli impianti dove get_nicks va in
        timeout: da' i tre esiti puliti, ma all'SGA vero fa comparire
        "Configurazione appartamento modificata" sull'app a ogni invio.
      default: get_nicks
      selector:
        select:
          options:
            - get_nicks
            - get_init_status
    sip_timeout:
      name: Timeout SIP per sonda (s)
      description: Quanto aspettare la risposta SIP (200/404) di ogni sonda prima di passare oltre.
      default: 8
      selector:
        number:
          min: 2
          max: 15
          step: 1
          unit_of_measurement: s
    apply:
      name: Applica come PICG
      description: Se trovato, scrive il PICG in picg_target (l'integrazione si ricarica).
      default: false
      selector:
        boolean:
    apply_sga:
      name: Applica anche come SGA
      description: >-
        Se trovato, scrive lo stesso indirizzo anche in sga_target (destinatario
        di segreteria, non disturbare e apri-porta). Sugli impianti visti finora
        coincidono; sono comunque due valori distinti.
      default: false
      selector:
        boolean:
