[project]
name = "vimar-intercom-dev"
version = "0.0.0"
description = "Tooling di sviluppo per l'integrazione HA vimar_intercom (non è il pacchetto HA)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not media and not browser and not slow'"
markers = [
    "live: richiede il Tab reale in rete (escluso di default)",
    "slow: end-to-end SIP and call-flow tests, about two minutes together (excluded by default; CI runs them: -m 'not live and not media and not browser')",
    "media: media vero con ffmpeg e aiohttp (escluso di default: -m media)",
    "browser: la card in Chromium/WebKit con playwright e aiohttp (escluso di default: -m browser)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/vimar_intercom"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
